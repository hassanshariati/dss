name: DSS Deploy (manual, verified SSH)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dss-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH using pinned known_hosts
        env:
          SSH_KEY: ${{ secrets.DSS_SSH_KEY }}
          SSH_HOST_KEYS: ${{ secrets.DSS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST_KEYS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy selected commit on 94.184.27.131
        env:
          SSH_USER: ${{ secrets.DSS_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SSH_USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@94.184.27.131" \
            "bash -se -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          cd /opt/dss
          test -d .git || { echo "Clone the repository into /opt/dss first" >&2; exit 1; }
          test -r .env || { echo "/opt/dss/.env is missing" >&2; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "Uncommitted tracked changes exist" >&2; exit 1; }
          git fetch origin main
          git checkout main
          git merge --ff-only "$SHA"
          docker compose up -d --build --remove-orphans
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18110/dss/api/health; then exit 0; fi
            sleep 3
          done
          exit 1
          REMOTE
